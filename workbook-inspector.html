<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Workbook Inspector Batch 1</title>
<style>:root {
  --font: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  --text: #24315E; --text-2: #5B678F; --text-3: #8B97B8; --label: #3A4670; --emph: #24315E;
  --bg: #FFFFFF; --bg-2: #F4F7FC; --bg-neutral: #E4EAF5; --page: #E9EEF8;
  --accent: #3F72E7; --accent-soft: #EEF3FC; --on-accent: #FFFFFF; --link: #3F72E7;
  --border: #E1E8F4; --divider: #DCE3F0; --grid: #EDF1F9; --alt-row: #F7FAFE;
  --th-bg: #24315E; --th-text: #FFFFFF;
  --good: #189B7E; --bad: #E0554C; --warn: #C98518; --neutral: #8B97B8; --purple: #7C63D8;
  --good-soft: #E3F5F0; --bad-soft: #FCE9E8; --warn-soft: #FBF1DF; --neutral-soft: #EEF1F7; --purple-soft: #EFEBFB;
  --shadow: 0 2px 10px rgba(36, 49, 94, .08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --text: #EAF0FB; --text-2: #9BA8CC; --text-3: #6D7CA8; --label: #D3DCF0; --emph: #FFFFFF;
    --bg: #2B3865; --bg-2: #1C2549; --bg-neutral: #3D4C82; --page: #131A33;
    --accent: #5B8BF0; --accent-soft: #263463; --on-accent: #0F1733; --link: #8BAAF2;
    --border: #3D4C82; --divider: #3D4C82; --grid: #37457B; --alt-row: #313E6E;
    --th-bg: #16203D; --th-text: #FFFFFF;
    --good: #58D3B4; --bad: #F0736A; --warn: #EDB355; --neutral: #8593BC; --purple: #9B85EC;
    --good-soft: #1E4A52; --bad-soft: #4F2D45; --warn-soft: #4A4140; --neutral-soft: #34416F; --purple-soft: #3A3570;
    --shadow: 0 2px 12px rgba(11, 16, 36, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --text: #EAF0FB; --text-2: #9BA8CC; --text-3: #6D7CA8; --label: #D3DCF0; --emph: #FFFFFF;
  --bg: #2B3865; --bg-2: #1C2549; --bg-neutral: #3D4C82; --page: #131A33;
  --accent: #5B8BF0; --accent-soft: #263463; --on-accent: #0F1733; --link: #8BAAF2;
  --border: #3D4C82; --divider: #3D4C82; --grid: #37457B; --alt-row: #313E6E;
  --th-bg: #16203D; --th-text: #FFFFFF;
  --good: #58D3B4; --bad: #F0736A; --warn: #EDB355; --neutral: #8593BC; --purple: #9B85EC;
  --good-soft: #1E4A52; --bad-soft: #4F2D45; --warn-soft: #4A4140; --neutral-soft: #34416F; --purple-soft: #3A3570;
  --shadow: 0 2px 12px rgba(11, 16, 36, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 13px; color: var(--text); background: var(--page); line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }
code, .mono { font-family: var(--mono); font-size: 12px; }

.app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto 1fr; height: 100%; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 10px 18px; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
.brand h1 { font-size: 16px; margin: 0; font-weight: 600; color: var(--emph); }
.brand small { display: block; color: var(--text-2); font-size: 11px; }
.top .spacer { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--label); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 4px 10px; cursor: pointer; color: var(--text-2); }
.seg button.on { background: var(--accent); color: var(--on-accent); }

aside.side { background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.drop { margin: 14px; border: 2px dashed var(--divider); border-radius: 10px; padding: 18px 12px; text-align: center; color: var(--text-2); cursor: pointer; background: var(--bg); transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.drop strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
.files { flex: 1; overflow: auto; padding: 0 10px 10px; }
.file { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
.file:hover { background: var(--bg); }
.file.sel { background: var(--bg); border-color: var(--accent); box-shadow: var(--shadow); }
.file .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .meta { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; color: var(--text-2); font-size: 11px; }
.file .x { border: 0; background: none; color: var(--text-3); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
.file .x:hover { color: var(--bad); }
.progress { grid-column: 1 / -1; height: 4px; background: var(--bg-neutral); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.side-foot { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.side-foot .hint { color: var(--text-2); font-size: 11px; }

main { overflow: auto; min-width: 0; }
.wrap { padding: 18px 22px 40px; max-width: 1500px; }
.empty { max-width: 760px; margin: 50px auto; text-align: left; }
.empty h2 { font-size: 22px; font-weight: 600; color: var(--emph); margin: 0 0 6px; }
.empty p { color: var(--text-2); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 18px; }

.card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--emph); display: flex; align-items: center; gap: 8px; }
.card h3 .sub { font-weight: 400; color: var(--text-2); font-size: 12px; }
.card.tight { padding: 10px 12px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 22px 0 8px; font-weight: 600; }
.section-title:first-child { margin-top: 0; }
.banner { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; border-left: 4px solid var(--accent); background: var(--accent-soft); }
.banner.warn { border-color: var(--warn); background: var(--warn-soft); }
.banner.bad { border-color: var(--bad); background: var(--bad-soft); }
.banner.good { border-color: var(--good); background: var(--good-soft); }
.banner.purple { border-color: var(--purple); background: var(--purple-soft); }

.filehead { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.filehead h2 { margin: 0; font-size: 19px; font-weight: 600; color: var(--emph); word-break: break-all; }
.filehead .facts { color: var(--text-2); font-size: 12px; margin-top: 2px; }
.filehead .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); color: var(--on-accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { padding: 3px 8px; font-size: 12px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--divider); margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 9px 11px; cursor: pointer; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; margin-left: 5px; background: var(--bg-neutral); color: var(--text-2); }
.tabs .count.high { background: var(--bad); color: #fff; }
.tabs .count.medium { background: var(--warn); color: #fff; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; border-left: 4px solid var(--accent); box-shadow: var(--shadow); }
.kpi .v { font-size: 24px; font-weight: 300; color: var(--emph); line-height: 1.15; }
.kpi .l { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.kpi .s { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.kpi.good { border-left-color: var(--good); } .kpi.bad { border-left-color: var(--bad); } .kpi.warn { border-left-color: var(--warn); } .kpi.neutral { border-left-color: var(--neutral); } .kpi.purple { border-left-color: var(--purple); }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: var(--neutral-soft); color: var(--label); white-space: nowrap; }
.chip.high, .chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.medium, .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.low { background: var(--accent-soft); color: var(--accent); }
.chip.info { background: var(--neutral-soft); color: var(--text-2); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.purple, .chip.velixo { background: var(--purple-soft); color: var(--purple); }
.chip.accent { background: var(--accent); color: var(--on-accent); }

.findings { list-style: none; padding: 0; margin: 0; }
.findings li { display: grid; grid-template-columns: 74px 110px 1fr auto; gap: 10px; align-items: start; padding: 9px 4px; border-bottom: 1px solid var(--grid); }
.findings li:last-child { border-bottom: 0; }
.findings .t { font-weight: 600; color: var(--emph); }
.findings .d { color: var(--text-2); font-size: 12px; }
.findings .cat { color: var(--text-2); font-size: 12px; }

.tbl-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th { position: sticky; top: 0; background: var(--th-bg); color: var(--th-text); font-weight: 600; text-align: left; padding: 7px 9px; white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }
table.t th.num, table.t td.num { text-align: right; }
table.t th .arr { opacity: .6; margin-left: 4px; }
table.t td { padding: 6px 9px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.t tr:nth-child(even) td { background: var(--alt-row); }
table.t td.formula { font-family: var(--mono); font-size: 11.5px; color: var(--label); word-break: break-all; min-width: 260px; }
table.t td.wrapcell { word-break: break-word; max-width: 520px; }
.tbl-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.tbl-tools input[type=search] { border: 1px solid var(--border); background: var(--bg-2); border-radius: 7px; padding: 5px 9px; min-width: 220px; }
.tbl-tools select { border: 1px solid var(--border); background: var(--bg-2); border-radius: 7px; padding: 5px 7px; }
.tbl-tools .n { color: var(--text-2); font-size: 11px; margin-left: auto; }

.kv { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 5px 16px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--text); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
.cols2 > .card { margin-bottom: 0; }
.stack > * + * { margin-top: 14px; }

.bar { height: 8px; background: var(--bg-neutral); border-radius: 4px; min-width: 80px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.muted { color: var(--text-2); }
.small { font-size: 11px; }
.ok { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }

details.json { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--bg-2); }
details.json summary { cursor: pointer; padding: 8px 10px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
details.json pre { margin: 0; padding: 10px 12px; max-height: 380px; overflow: auto; font-family: var(--mono); font-size: 11.5px; border-top: 1px solid var(--border); background: var(--bg); white-space: pre-wrap; word-break: break-all; }

.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
.preset { border: 2px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; background: var(--bg); }
.preset:hover { border-color: var(--accent); }
.preset.on { border-color: var(--accent); background: var(--accent-soft); }
.preset b { display: block; color: var(--emph); margin-bottom: 4px; }
.preset span { color: var(--text-2); font-size: 12px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 18px; }
.opts label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.opts label small { display: block; color: var(--text-2); }
.opts input { accent-color: var(--accent); margin-top: 3px; }
.cmp td.b { color: var(--text-2); }
.cmp td.a { font-weight: 600; }

.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: calc(18px + env(safe-area-inset-right, 0px)); background: var(--th-bg); color: #fff; padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; z-index: 10; }
.toast.on { opacity: 1; transform: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; }
  aside.side { border-right: 0; border-bottom: 1px solid var(--border); }
  .files { max-height: 220px; }
  .findings li { grid-template-columns: 70px 1fr; }
  .findings .cat, .findings li > :last-child { display: none; }
}

/* jump-to highlight + issues-only */
:root { --halo: rgba(63, 114, 231, .55); }
:root[data-theme="dark"] { --halo: rgba(139, 170, 242, .6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --halo: rgba(139, 170, 242, .6); } }
.sec { display: block; border-radius: 12px; scroll-margin-top: 16px; }
#tabbody > .sec + .sec { margin-top: 22px; }
@keyframes halo {
  0%   { box-shadow: 0 0 0 0 transparent; background: transparent; }
  15%  { box-shadow: 0 0 0 3px var(--accent), 0 0 26px 8px var(--halo); background: var(--accent-soft); }
  65%  { box-shadow: 0 0 0 3px var(--accent), 0 0 26px 8px var(--halo); background: var(--accent-soft); }
  100% { box-shadow: 0 0 0 0 transparent; background: transparent; }
}
.sec.halo { animation: halo 2.8s ease-in-out; }
.tabs button.dim { opacity: .45; }
.t th.tip { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
body.simple #issuesWrap, body.simple #exportAll { display: none; }

/* ---------- top bar groups ---------- */
.topgroup { display: flex; align-items: center; gap: 8px; }
.topgroup .lbl { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

/* ---------- collapsible side panel ---------- */
.app { transition: grid-template-columns .2s ease; }
.app.side-off { grid-template-columns: 56px 1fr; }
.sidehead { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.sidehead + .drop { margin-top: 8px; }
.sidetoggle { border: 1px solid var(--border); background: var(--bg); color: var(--text-2); border-radius: 7px; width: 28px; height: 26px; cursor: pointer; font-size: 14px; line-height: 1; }
.sidetoggle:hover { color: var(--accent); border-color: var(--accent); }
.railadd { display: none; width: 34px; height: 34px; margin: 10px auto 4px; border-radius: 9px; border: 2px dashed var(--divider); background: var(--bg); color: var(--text-2); font-size: 18px; cursor: pointer; }
.railadd:hover { border-color: var(--accent); color: var(--accent); }
.side-off .sidehead { justify-content: center; padding: 12px 0 0; }
.side-off .sidehead span, .side-off .drop, .side-off .side-foot { display: none; }
.side-off .railadd { display: block; }
.side-off .files { padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.av { position: relative; width: 34px; height: 34px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--emph); cursor: pointer; flex: none; }
.av.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.av i { position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-2); }

/* ---------- sticky file header, actions, export menu ---------- */
.ahead { position: sticky; top: -18px; z-index: 6; background: var(--page); margin: -18px -22px 0; padding: 18px 22px 0; }
.ahead .tabs { margin-bottom: 0; align-items: center; }
.tabopt { margin-left: auto; font-size: 12px; padding: 0 4px 4px; }
.btn.icon { width: 34px; padding: 6px 0; font-size: 15px; line-height: 1; }
.menuwrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow); padding: 5px; min-width: 260px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--text); }
.menu button:hover { background: var(--accent-soft); color: var(--accent); }
.menu .sep { height: 1px; background: var(--divider); margin: 4px 2px; }

/* ---------- overview ---------- */
.ov-strip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 16px 0 10px; }
.ov-strip .spacer { flex: 1; }
.ov-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-weight: 600; color: var(--emph); user-select: none; }
.ov-pill .num { font-size: 18px; font-weight: 300; }
.ov-pill .dot { width: 10px; height: 10px; border-radius: 50%; }
.ov-pill.off { opacity: .4; }
.ov-pill:hover { border-color: var(--accent); }
.ov-verdict { font-size: 13px; color: var(--text-2); margin: 0 0 12px; }
.ov-list { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.ov-group + .ov-group { border-top: 1px solid var(--divider); }
.ov-ghead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-neutral); cursor: pointer; font-weight: 600; color: var(--emph); }
.ov-ghead .gchev { display: inline-block; transition: transform .15s; }
.ov-ghead .gchev.open { transform: rotate(90deg); }
.ov-ghead .cnt { display: flex; gap: 4px; margin-left: auto; }
.ov-ghead .mini { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; color: #fff; }
.ov-row { display: grid; grid-template-columns: 4px 1fr auto 18px; border-top: 1px solid var(--divider); cursor: pointer; }
.ov-list > .ov-row:first-child { border-top: 0; }
.ov-row:hover { background: var(--accent-soft); }
.ov-row .t { padding: 10px 14px; color: var(--emph); font-weight: 500; }
.ov-row .sev { font-size: 11px; font-weight: 700; letter-spacing: .04em; margin-right: 8px; }
.ov-row .area { padding: 10px 6px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.ov-row .chev { padding: 10px 0; color: var(--text-2); transition: transform .15s; }
.ov-row.open .chev { transform: rotate(90deg); }
.ov-row .det { display: none; grid-column: 2 / 5; padding: 0 14px 12px; color: var(--text); }
.ov-row.open .det { display: block; }

        if (c1 === c2 && r1 === r2) { const k = key(s, c1, r1); if (vol.has(k)) return { k, name: nm }; continue; }

    for (const g of out.groups) g.range = g.cells > 1 && g.last !== g.cell ? g.cell + ' ... ' + g.last : g.cell;

  }

    if (vn.map.size) {
      ctx.volNameMap = vn.map; ctx.volNameDisplay = vn.display;
      ctx.volNameRx = new RegExp('(?<![A-Za-z0-9_.])(' + [...vn.map.keys()].map(escRx).join('|') + ')(?![A-Za-z0-9_.(])', 'gi');
    }
    ctx.analyze = makeFormulaAnalyzer(ctx);
    for (const n of names) {
      const a = bareAnalyze(n.formula || '');
      n.volatile = a.volatile.map((v) => v.fn);
      const viaK = vn.map.get((n.name || '').toUpperCase());
      if (viaK) n.volatile = [...new Set([...n.volatile, ...viaK])];
      n.broken = /#REF!/.test(n.formula || '');
      n.external = a.extRef;
      n.velixo = a.velixo;
      n.builtIn = /^_xlnm\./i.test(n.name || '');
    }
    R.definedNames = names;

    // ---- shared strings + styles
    const sstPath = wbRels.find((r) => r.type === 'sharedStrings');
    const sst = parseSharedStrings(sstPath && sstPath.path ? await pkg.text(sstPath.path) : await pkg.text('xl/sharedStrings.xml'));
    const stylesRel = wbRels.find((r) => r.type === 'styles');
    const stylesXml = await pkg.text(stylesRel && stylesRel.path ? stylesRel.path : 'xl/styles.xml');
    const countOf = (tag, child) => {
      const m = new RegExp('<' + tag + '\\b([^>]*?)(?:/>|>([\\s\\S]*?)</' + tag + '>)').exec(stylesXml);
      if (!m) return 0;
      const c = attr(m[1], 'count');
      if (c != null) return +c;
      return ((m[2] || '').match(new RegExp('<' + child + '\\b', 'g')) || []).length;
    };
    R.styles = { cellXfs: countOf('cellXfs', 'xf'), cellStyles: countOf('cellStyles', 'cellStyle'), fonts: countOf('fonts', 'font'),
      fills: countOf('fills', 'fill'), borders: countOf('borders', 'border'), numFmts: countOf('numFmts', 'numFmt'), dxfs: countOf('dxfs', 'dxf') };

    // ---- per sheet
    const allFindings = [], allWhole = [], velixoSample = [];
    const hiddenDumps = [];
    let velixoClassicConns = [], nx = null, settingsRows = [], giRows = [];
    const hyperlinks = [];
    let richCells = 0;
    R.tables = []; R.pivots = []; R.comments = { count: 0, authors: new Set(), threaded: 0 };
    let idx = 0;
    const usedXf = new Set([0]);
    const sheetXml = new Map(), sheetByName = new Map(sheets.map((x) => [x.name, x]));
    const getXml = async (name) => { if (sheetXml.has(name)) return sheetXml.get(name); const x = sheetByName.get(name); return x && x.part ? await pkg.text(x.part) : null; };
    const skipSheet = (sh, err) => { R.status = 'partial'; R.notes.push('Sheet "' + sh.name + '" could not be scanned and is left out of the results: ' + (err && err.message ? err.message : err)); };
    for (const sh of sheets) {
      idx++;
      progress('Scanning ' + sh.name, idx / Math.max(1, sheets.length));
      await yieldUI();
      sh.stats = null;
      if (!sh.part || !pkg.has(sh.part)) continue;
      const entry = pkg.map.get(pkg.resolve(sh.part));
      sh.partSize = entry ? entry.size : 0;
      const rels = await readRels(pkg, sh.part);
      sh.objects = { tables: 0, pivots: 0, charts: 0, pictures: 0, shapes: 0, comments: 0, threadedComments: 0, controls: 0, activeX: 0, embedded: 0 };
      sh.formControls = []; sh.embeds = [];
      for (const r of rels) {
        if (r.type === 'table' && r.path) {
          const tx = await pkg.text(r.path); const tt = /<table\b[^>]*>/.exec(tx);
          if (tt) R.tables.push({ sheet: sh.name, name: attr(tt[0], 'displayName') || attr(tt[0], 'name'), ref: attr(tt[0], 'ref'), autoFilter: /<autoFilter\b/.test(tx),
            columns: [...tx.matchAll(/<tableColumn\b[^>]*>/g)].map((c) => dec(attr(c[0], 'name') || '')) });
          sh.objects.tables++;
        } else if (r.type === 'pivotTable' && r.path) {
          const px = await pkg.text(r.path); const pt = /<pivotTableDefinition\b[^>]*>/.exec(px);
          const loc = /<location\b[^>]*>/.exec(px);
          R.pivots.push({ sheet: sh.name, name: pt ? attr(pt[0], 'name') : r.path, cacheId: pt ? attr(pt[0], 'cacheId') : null, ref: loc ? attr(loc[0], 'ref') : null });
          sh.objects.pivots++;
        } else if (r.type === 'drawing' && r.path) {
          const dx = await pkg.text(r.path);
          sh.objects.charts += (dx.match(/<c:chart\b/g) || []).length;
          sh.objects.pictures += (dx.match(/<xdr:pic\b/g) || []).length;
          sh.objects.shapes += (dx.match(/<xdr:sp\b/g) || []).length;
        } else if (r.type === 'comments' && r.path) {
          const cx = await pkg.text(r.path);
          const n = (cx.match(/<comment\b/g) || []).length;
          sh.objects.comments += n; R.comments.count += n;
          for (const a of cx.matchAll(/<author>([\s\S]*?)<\/author>/g)) if (a[1].trim()) R.comments.authors.add(dec(a[1].trim()));
        } else if (r.type === 'threadedComment' && r.path) {
          const cx = await pkg.text(r.path);
          const n = (cx.match(/<threadedComment\b/g) || []).length;
          sh.objects.threadedComments += n; R.comments.threaded += n;
        } else if (r.type === 'ctrlProp') sh.objects.controls++;
        else if (r.type === 'control') sh.objects.activeX++;
        else if ((r.type === 'oleObject' || r.type === 'package') && r.path) { sh.objects.embedded++; const en = pkg.map.get(pkg.resolve(r.path) || ''); sh.embeds.push({ part: r.path, size: en ? en.size : 0 }); }
        else if (r.type === 'vmlDrawing' && r.path) {
          const vx = await pkg.text(r.path);
          for (const m of vx.matchAll(/<x:ClientData\b[^>]*ObjectType="([^"]+)"/g)) if (m[1] !== 'Note') sh.formControls.push(m[1]);
        }
      }
      if (sh.kind !== 'worksheet') continue;
      let xml;
      try { xml = await pkg.text(sh.part); } catch (err) { skipSheet(sh, err); continue; }
      if (xml.length <= T.SHEET_XML_CACHE_CHARS) sheetXml.set(sh.name, xml);
      for (const m of xml.matchAll(/<(?:c|row)\b[^>]*?\bs="(\d+)"/g)) usedXf.add(+m[1]);
      for (const m of xml.matchAll(/<col\b[^>]*?\bstyle="(\d+)"/g)) usedXf.add(+m[1]);
      const label = sh.state !== 'visible' ? sh.name + ' [' + sh.state + ']' : sh.name;
      ctx.currentSheet = sh.name; ctx.sheetIdx = idx - 1;
      const rc = (xml.match(/<c\b[^>]*?\bvm="/g) || []).length; richCells += rc;
      let res;
      try { res = scanSheet(xml, label, ctx, sst); } catch (err) { skipSheet(sh, err); continue; }
      res.stats.richValueCells = rc;
      const relById = new Map(rels.map((r) => [r.id, r]));
      for (const hm of xml.matchAll(/<hyperlink\b[^>]*>/g)) {
        const t = hm[0], ref = attr(t, 'ref'), rid = attr(t, 'r:id'), loc = attr(t, 'location');
        if (rid && relById.get(rid)) { const tg = relById.get(rid).target || ''; if (!/^(https?|mailto):/i.test(tg)) hyperlinks.push({ sheet: sh.name, cell: ref, target: safeUnescape(tg), type: 'file' }); }
        else if (loc) {
          const m = /^(?:'((?:[^']|'')+)'|([^!]+))!/.exec(loc);
          const tsheet = m ? (m[1] ? m[1].replace(/''/g, "'") : m[2]) : null;
          const ok = tsheet ? sheetByName.has(tsheet) : nameExact.has(loc);
          if (!ok) hyperlinks.push({ sheet: sh.name, cell: ref, target: loc, type: 'internal', broken: true });
        }
      }
      sh.stats = res.stats;
      for (const f of res.findings) allFindings.push(f);
      for (const w of res.whole) allWhole.push(w);
      for (const v of res.velixoCellsSample) if (velixoSample.length < 300) velixoSample.push({ sheet: sh.name, ...v });
      if (isVelixoStateSheet(sh.name) || sh.state === 'veryHidden') {
        hiddenDumps.push({ sheet: sh.name, state: sh.state, ...dumpCells(xml, sst, T.HIDDEN_SHEET_CELL_CAP) });
        if (sh.name === 'VelixoReportsConnections') velixoClassicConns = classicConnections(xml, sst);
        if (sh.name === 'VelixoNxStorage') nx = nxStorage(xml, sst);
        if (/^Velixo(Reports)?Settings$/i.test(sh.name)) settingsRows = sheetRows(xml, sst);
        if (/^Velixo(Reports)?GIOptions$/i.test(sh.name)) giRows = sheetRows(xml, sst);
      }
    }
    R.styles.usedXfs = [...usedXf].filter((i) => i < R.styles.cellXfs).length;
    // threaded comment persons
    const persons = await pkg.text(pkg.names().find((n) => /^xl\/persons\/person\.xml$/i.test(n)) || '');
    R.comments.persons = [...persons.matchAll(/<person\b[^>]*>/g)].map((p) => attr(p[0], 'displayName')).filter(Boolean);
    R.comments.authors = [...R.comments.authors];

    // defined-name volatile findings (formula on the name itself)
    for (const n of names) {
      if (!n.formula) continue;
      const a = bareAnalyze(n.formula);

    }

    // ---- pivot caches
    R.pivotCaches = [];
    const cacheIdByRel = new Map([...wbXml.matchAll(/<pivotCache\b[^>]*>/g)].map((m) => [attr(m[0], 'r:id'), attr(m[0], 'cacheId')]));
    for (const r of wbRels.filter((x) => x.type === 'pivotCacheDefinition' && x.path)) {
      const px = await pkg.text(r.path);
      const def = /<pivotCacheDefinition\b[^>]*>/.exec(px);
      const ws = /<worksheetSource\b[^>]*>/.exec(px);
      const crels = await readRels(pkg, r.path);
      const cacheId = cacheIdByRel.get(r.id);
      let src = { type: 'Unknown', status: 'ok', detail: '', external: null };
      if (ws) {
        const sSheet = attr(ws[0], 'sheet'), sRef = attr(ws[0], 'ref'), sName = attr(ws[0], 'name'), sRid = attr(ws[0], 'r:id');
        const ext = sRid ? crels.find((c) => c.id === sRid) : null;
        if (ext) src = { type: 'Other workbook', status: 'external', external: safeUnescape(ext.target || ''), detail: (sSheet ? sSheet + '!' : '') + (sRef || sName || '') };
        else if (sName) {
          const tb = R.tables.find((t) => (t.name || '').toUpperCase() === sName.toUpperCase());
          const cand = nameUpper.get(sName.toUpperCase()) || [];
          const ok = cand.length > 0 || !!tb;
          const nm = cand.find((nn) => nn.scope === 'Workbook') || cand[0];
          const nmSheet = nm ? (/^(?:'((?:[^']|'')+)'|([^!']+))!/.exec(nm.formula || '') || []) : [];
          src = { type: 'Named range / table', status: ok ? 'ok' : 'missing', detail: sName + (ok ? '' : ' - name or table not found'), sourceSheet: tb ? tb.sheet : nmSheet[1] ? nmSheet[1].replace(/''/g, "'") : nmSheet[2] || null };
        } else if (sSheet) {
          const ok = sheets.some((x) => x.name === sSheet);
          src = { type: 'Sheet range', status: ok ? 'ok' : 'missing', detail: sSheet + '!' + (sRef || '') + (ok ? '' : ' - sheet not in this workbook'), sourceSheet: ok ? sSheet : null };
        }
      } else if (/<cacheSource\b[^>]*type="external"/.test(px)) {
        const cid = attr((/<cacheSource\b[^>]*>/.exec(px) || [''])[0], 'connectionId');
        src = { type: 'Data connection', status: 'ok', detail: 'connection ' + (cid || '?') };
      } else if (/<cacheSource\b[^>]*type="consolidation"/.test(px)) src = { type: 'Consolidation ranges', status: 'ok', detail: '' };
      const rec = crels.find((c) => c.type === 'pivotCacheRecords');
      const recEntry = rec && rec.path ? pkg.map.get(pkg.resolve(rec.path) || '') : null;
      R.pivotCaches.push({ part: r.path, cacheId, sourceInfo: src, pivotNames: [], recordCount: def ? attr(def[0], 'recordCount') : null,
        refreshOnLoad: !!def && ['1', 'true'].includes(attr(def[0], 'refreshOnLoad')),
        saveData: !def || attr(def[0], 'saveData') !== '0',
        source: ws ? (attr(ws[0], 'sheet') ? attr(ws[0], 'sheet') + '!' : '') + (attr(ws[0], 'ref') || attr(ws[0], 'name') || '') : (/<cacheSource\b[^>]*type="external"/.test(px) ? 'External connection' : '?'),
        recordsSize: recEntry ? recEntry.size : 0 });
    }

    for (const pc of R.pivotCaches) pc.pivotNames = R.pivots.filter((pv) => pv.cacheId != null && pv.cacheId === pc.cacheId).map((pv) => pv.sheet + ' / ' + pv.name);
    // ---- external links
    R.externalLinks = [];
    const extOrder = [...wbXml.matchAll(/<externalReference\b[^>]*>/g)].map((m) => relById.get(attr(m[0], 'r:id'))).filter(Boolean);
    for (const r of (extOrder.length ? extOrder : wbRels.filter((x) => x.type === 'externalLink')).filter((x) => x.path)) {
      const lx = await pkg.text(r.path);
      const lrels = await readRels(pkg, r.path);
      const tgt = lrels.find((x) => x.type === 'externalLinkPath' || x.external);
      R.externalLinks.push({ part: r.path, target: tgt ? safeUnescape(tgt.target) : '(unknown)', sheets: [...lx.matchAll(/<sheetName\b[^>]*>/g)].map((s) => attr(s[0], 'val')) });
    }
    // charts referencing external links or #REF!
    for (const cp of pkg.names().filter((n) => /^xl\/charts\/chart\d+\.xml$/i.test(n))) {
      const cx = await pkg.text(cp);
      for (const m of cx.matchAll(/<c:f>([\s\S]*?)<\/c:f>/g)) {
        const f = dec(m[1]);
        for (const ix of [...f.matchAll(RX.ext)].map((x) => +(x[1] || x[2]))) { const u = ctx.extUse.get(ix) || { cells: 0, sheets: new Set(), sample: null }; u.charts = (u.charts || 0) + 1; ctx.extUse.set(ix, u); }
        if (/#REF!/.test(f) && ctx.refErrs.length < T.DETAIL_CAP) ctx.refErrs.push({ where: 'Chart series', sheet: cp.split('/').pop(), cell: '', formula: f, cells: 0 });
      }
    }
    // ---- data connections / Power Query
    const connXml = await pkg.text('xl/connections.xml');
    R.dataConnections = [...connXml.matchAll(/<connection\b([^>]*)>/g)].map((c) => ({
      name: attr(c[1], 'name'), type: attr(c[1], 'type'), description: attr(c[1], 'description'),
      refreshOnLoad: ['1', 'true'].includes(attr(c[1], 'refreshOnLoad')), powerQuery: /Microsoft\.Mashup/i.test(connXml) && /Query - /.test(attr(c[1], 'name') || '') }));
    let powerQuery = false;
    for (const p of pkg.names().filter((n) => /^customXml\/item\d+\.xml$/i.test(n))) {
      const e = pkg.map.get(p);
      if (e && e.size < 50 * 1024 * 1024) { const x = await pkg.text(p); if (/DataMashup/.test(x.slice(0, 2000))) { powerQuery = true; break; } }
    }
    R.powerQuery = powerQuery || R.dataConnections.some((c) => c.powerQuery);

    // ---- links & references
    const selfName = fileName.toLowerCase();
    const links = R.externalLinks.map((l, i) => {
      const idx = i + 1, u = ctx.extUse.get(idx) || { cells: 0, sheets: new Set() };
      const nm = names.filter((n) => (n.formula || '').indexOf('[' + idx + ']') >= 0).map((n) => n.name);
      const cp = classifyPath(l.target);
      const base = cp.path.split(/[\\/]/).pop().toLowerCase();
      return { index: idx, target: l.target, path: cp.path, kind: cp.kind, risk: cp.risk, why: cp.why, linkSheets: l.sheets, cells: u.cells, other: u.other || 0, charts: u.charts || 0,
        names: nm, usedOn: [...u.sheets], sample: u.sample, unused: !u.cells && !u.other && !u.charts && !nm.length, selfLink: base === selfName };
    });
    const brokenIndex = [...ctx.extUse.entries()].filter(([ix]) => ix > R.externalLinks.length).map(([ix, u]) => ({ index: ix, cells: u.cells + (u.other || 0) + (u.charts || 0), sheets: [...u.sheets], sample: u.sample }));
    for (const n of names) if (n.broken && !n.builtIn) ctx.refErrs.push({ where: 'Defined name', sheet: n.scope, cell: n.name, formula: n.formula, cells: 0 });
    const pivotSources = R.pivotCaches.map((pc) => ({ cacheId: pc.cacheId, part: pc.part, pivots: pc.pivotNames, ...pc.sourceInfo, ...(pc.sourceInfo.external ? (() => { const c = classifyPath(pc.sourceInfo.external); return { path: c.path, kind: c.kind, risk: c.risk, why: c.why }; })() : {}) }));
    const paths = [];
    for (const ps of pivotSources.filter((x) => x.external)) paths.push({ where: 'Pivot table source', location: ps.pivots.join(', ') || ps.part, path: ps.path, kind: ps.kind, risk: ps.risk, why: ps.why });
    for (const l of links) paths.push({ where: 'Linked workbook [' + l.index + ']', location: l.usedOn.join(', ') || '(not used)', path: l.path, kind: l.kind, risk: l.risk, why: l.why });
    for (const h of hyperlinks.filter((x) => x.type === 'file')) { const c = classifyPath(h.target); paths.push({ where: 'Hyperlink', location: h.sheet + '!' + h.cell, path: c.path, kind: c.kind, risk: c.risk, why: c.why }); }
    for (const pl of ctx.pathLits) { const c = classifyPath(pl.path); paths.push({ where: pl.where, location: pl.sheet + '!' + pl.cell, path: c.path, kind: c.kind, risk: c.risk, why: c.why }); }
    for (const c of [...connXml.matchAll(/<connection\b([^>]*)>([\s\S]*?)<\/connection>/g)]) {
      const nm = attr(c[1], 'name'); const odc = attr(c[1], 'odcFile');
      const srcs = [odc, ...[...c[2].matchAll(/\b(?:sourceFile|url)="([^"]*)"/g)].map((m) => dec(m[1])), ...[...c[2].matchAll(/connection="([^"]*)"/g)].map((m) => { const d = /(?:Data Source|DBQ)=([^;]+)/i.exec(dec(m[1])); return d ? d[1] : null; })].filter(Boolean);
      for (const sp of srcs) if (/^([A-Za-z]:\\|\\\\|file:|https?:)/i.test(sp)) { const k = classifyPath(sp); paths.push({ where: 'Data connection', location: nm, path: k.path, kind: k.kind, risk: k.risk, why: k.why }); }
    }
    R.links = { pivotSources, workbooks: links, brokenIndex, refErrors: ctx.refErrs, refErrorCells: R.sheets.reduce((a, x) => a + (x.stats ? x.stats.refErrCells : 0), 0), hyperlinks, brokenHyperlinks: hyperlinks.filter((h) => h.broken), paths };

    // ---- Velixo
    progress('Reading Velixo data', 1);
    const vx = await readVelixoAddin(pkg);
    const velixoSheets = sheets.filter((s) => isVelixoStateSheet(s.name)).map((s) => ({ name: s.name, state: s.state }));
    const fnList = [...ctx.fnUse.values()].map((u) => ({ ...u, sheets: [...u.sheets] }));
    const vxFns = fnList.filter((u) => u.cat === 'velixo').sort((a, b) => b.cells - a.cells);
    // A lone add-in binding without Velixo state is still taken as Velixo when the workbook is otherwise a Velixo workbook.
    if (!vx.addin && vx.others.length === 1 && (velixoSheets.length || vxFns.length)) { vx.addin = vx.others[0]; vx.others = []; }
    const connections = vx.connections.length ? vx.connections : velixoClassicConns;
    const connNames = new Set(connections.map((c) => String(c.name || '').toUpperCase()));
    // duplicate / conflicting connections
    const normUri = (u) => String(u || '').trim().toLowerCase().replace(/\/+$/, '');
    const connIssues = [];
    const byTarget = new Map();
    const nxNames = new Set(connections.map((c) => String(c.name || '').toUpperCase()));
    const allConns = [...connections, ...(vx.connections.length ? velixoClassicConns.filter((c) => !nxNames.has(String(c.name || '').toUpperCase())) : [])];
    for (const c of allConns) { const k = normUri(c.uri) + '|' + String(c.tenant || '').toLowerCase(); if (!byTarget.has(k)) byTarget.set(k, []); byTarget.get(k).push(c); }
    for (const list of byTarget.values()) { const nm = [...new Set(list.map((c) => c.name))]; if (nm.length > 1) connIssues.push({ type: 'Duplicate', names: nm.join(', '), detail: 'Same ERP site and tenant saved under ' + nm.length + ' names (' + (list[0].uri || '') + (list[0].tenant ? ', ' + list[0].tenant : '') + ').' }); }
    const byName = new Map();
    for (const c of connections) { const k = String(c.name || '').toUpperCase(); if (!byName.has(k)) byName.set(k, []); byName.get(k).push(c); }
    for (const list of byName.values()) if (list.length > 1 && new Set(list.map((c) => normUri(c.uri) + '|' + String(c.tenant || '').toLowerCase())).size > 1) connIssues.push({ type: 'Same name, different target', names: list[0].name, detail: list.map((c) => (c.uri || '?') + (c.tenant ? ' / ' + c.tenant : '')).join(' vs ') });
    if (vx.connections.length && velixoClassicConns.length) {
      const sheetBy = new Map(velixoClassicConns.map((c) => [String(c.name || '').toUpperCase(), c]));
      const nxBy = new Map(vx.connections.map((c) => [String(c.name || '').toUpperCase(), c]));
      for (const [k, c] of nxBy) { const sc = sheetBy.get(k); if (!sc) connIssues.push({ type: 'Not in connections sheet', names: c.name, detail: 'In the add-in state but missing from VelixoReportsConnections.' }); else if (normUri(sc.uri) !== normUri(c.uri) || String(sc.tenant || '').toLowerCase() !== String(c.tenant || '').toLowerCase()) connIssues.push({ type: 'Add-in vs sheet differ', names: c.name, detail: 'Add-in: ' + (c.uri || '') + ' / ' + (c.tenant || '') + ' - sheet: ' + (sc.uri || '') + ' / ' + (sc.tenant || '') }); }
      for (const [k, c] of sheetBy) if (!nxBy.has(k)) connIssues.push({ type: 'Only in connections sheet', names: c.name, detail: 'In VelixoReportsConnections but not in the add-in state.' });
    }
    const xmlCache = new Map();
    const cellAt = async (sheetName, ref) => {
      if (!xmlCache.has(sheetName)) xmlCache.set(sheetName, await getXml(sheetName));
      const xml = xmlCache.get(sheetName); if (!xml) return null;
      const i = xml.indexOf(' r="' + ref + '"'); if (i < 0) return null;
      const s = xml.lastIndexOf('<c', i), gt = xml.indexOf('>', i);
      if (s < 0 || gt < 0 || xml[gt - 1] === '/') return null;
      const end = xml.indexOf('</c>', gt); if (end < 0) return null;
      return cellValue(xml.slice(s + 2, gt), xml.slice(gt + 1, end), sst);
    };
    const resolveArg = async (arg, sheet) => {
      if (arg === '') return { value: null, via: 'empty - default connection' };
      let m = /^"(.*)"$/.exec(arg); if (m) return { value: m[1], via: 'literal' };
      const plain = arg.replace(/\$/g, '');
      m = /^(?:'((?:[^']|'')+)'|([^!'"(),]+))?!?([A-Z]{1,3}\d+)$/i.exec(plain);
      if (m && /!|^[A-Z]{1,3}\d+$/i.test(plain)) { const sh = m[1] ? m[1].replace(/''/g, "'") : m[2] || sheet; return { value: await cellAt(sh, m[3].toUpperCase()), via: 'cell ' + (sh !== sheet ? sh + '!' : '') + m[3].toUpperCase() }; }
      if (/^[A-Za-z_\\][\w.]*$/.test(arg)) {

  /* ---------------- remove Velixo state sheets ---------------- */

  /* ---------------- remove the add-in binding ---------------- */

  /* ---------------- scrub personal information ---------------- */
  function redactLastRefresh(text) {

      .replace(/(lastRefreshedBy(?:&quot;|&apos;|&amp;|&#\d+;|[^A-Za-z0-9@<&]){0,40}?)([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g, '$1')

    const changed = [];

  function fixOrphanShared(body, stats) {

  function flatten(P, velixoOnly) {

    const bodies = new Map(sheets.map((s) => [s.path, P.txt(s.path)]));
    const forced = new Set();
    if (velixoOnly) {

  /* ---------------- tidy shared strings ---------------- */

    const sstName = P.find(SST);

    const sst = P.txt(sstName);
    const sis = [...sst.matchAll(/<si\b[^>]*?(?:\/>|>[\s\S]*?<\/si>)/g)].map((m) => m[0]);
    const sheets = sheetList(P).filter((s) => s.path && P.has(s.path));
    const used = new Set();
    const rx = /(<c\b[^>]*\bt="s"[^>]*>\s*<v>)(\d+)(<\/v>)/g;
    for (const s of sheets) for (const m of P.txt(s.path).matchAll(rx)) used.add(+m[2]);
    if (!used.size) { removeWorkbookPart(P, sstName, 'sharedStrings'); return 'removed (unreferenced)'; }
    const order = [...used].sort((a, b) => a - b);
    const remap = new Map(order.map((o, i) => [o, i]));
    let refs = 0;
    for (const s of sheets) {
      const body = P.txt(s.path);

      P.set(s.path, body.replace(rx, (m, a, n, b) => { refs++; return a + remap.get(+n) + b; }));

  /* Last row/col that must stay: cell content, merges, hyperlinks, tables, drawings, comments. */

    const sd = sheetDataBounds(xml);
    const body = sd ? xml.slice(sd.start, sd.end) : '';
    for (const m of body.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {

  function sheetDataBounds(xml) {

  /* ------------------------------------------------------------ tables */

    if (!(o.removeAddin || o.removeHiddenSheets || o.scrubPersonal)) return '';
    const used = R.functions.filter((f) => f.cat === 'native').map((f) => (o.flatten && o.flattenVelixoOnly ? { ...f, cells: f.nonVelixoCells } : f)).filter((f) => f.cells > 0);
    const rows = [];
    for (const [ver, list] of Object.entries(NEW_FUNCS)) { const set = list.split(' '); const hit = used.filter((f) => set.includes(f.name)); if (hit.length) rows.push(ver + ': ' + hit.map((f) => f.name + ' (' + n(f.cells) + ')').join(', ')); }
    if (!rows.length) return '';
    return '<div class="banner warn" style="margin-top:10px"><b>Newer Excel functions stay live in this copy.</b> Recipients on older Excel versions will see #NAME? in these cells:<br>' + rows.map(e).join('<br>') + '</div>';
  }
  function summaryOf(R) {
    const ws = R.sheets.filter((s) => s.stats);
    return {
      'Velixo enabled': R.velixo.isVelixo ? 'Yes (' + R.velixo.edition + ')' : 'No', 'Velixo state sheets': R.velixo.sheets.length, 'Add-in parts': R.velixo.webextParts.length, 'Stored connections': R.velixo.connections.length,
      'Velixo formula cells': R.velixo.cells, 'All formula cells': ws.reduce((a, s) => a + s.stats.formulaCells, 0), 'Sheets': R.sheets.length,
      'Personal info fields (scrubbable)': R.personal.filter((p) => p.removedByScrub === true).length, 'Defined names': R.definedNames.length, '#REF! names': R.definedNames.filter((x) => x.broken).length,
      'Cell formats': R.styles.cellXfs, 'Named styles': R.styles.cellStyles, 'Used-range bloat sheets': R.perf.bloated ? R.perf.bloated.length : 'n/a', 'CF rules / whole-column': R.perf.cf.total + ' / ' + R.perf.cf.big, 'Full calc on load': R.workbook.fullCalcOnLoad ? 'Yes' : 'No', 'Size on disk': kb(R.file.size),
    };
  }
  function compareTable(A, B) {
    const a = summaryOf(A), b = summaryOf(B);
    return '<table class="t cmp"><thead><tr><th>Check</th><th>Original</th><th>Cleaned copy</th></tr></thead><tbody>' + Object.keys(a).map((k) => '<tr><td>' + e(k) + '</td><td class="b">' + e(a[k]) + '</td><td class="a">' + e(b[k]) + '</td></tr>').join('') + '</tbody></table>';
  }
  function findingDiff(A, B) {
    const key = (x) => x.cat + '|' + (x.sec || '') + '|' + x.title.replace(/[\d,.]+/g, '#');
    const a = A.findings.filter((x) => x.sev !== 'info'), b = B.findings.filter((x) => x.sev !== 'info');
    const bk = new Set(b.map(key)), ak = new Set(a.map(key));
    const gone = a.filter((x) => !bk.has(key(x))), still = b.filter((x) => ak.has(key(x))), added = b.filter((x) => !ak.has(key(x)));
    const li = (l) => '<ul style="margin:4px 0 0;padding-left:18px">' + l.map((x) => '<li>' + sevChip(x.sev) + ' ' + e(plural(x.title)) + '</li>').join('') + '</ul>';
    return '<div style="margin-top:12px"><b>Findings in the copy</b> <span class="chip good">' + gone.length + ' resolved</span> <span class="chip warn">' + still.length + ' still present</span>' + (added.length ? ' <span class="chip bad">' + added.length + ' new</span>' : '') +
      (still.length ? '<details class="json" style="margin-top:8px" open><summary>Still present</summary><div style="padding:6px 10px">' + li(still) + '</div></details>' : '') +
      (added.length ? '<details class="json" open><summary>New in the copy</summary><div style="padding:6px 10px">' + li(added) + '</div></details>' : '') +
      (gone.length ? '<details class="json"><summary>Resolved</summary><div style="padding:6px 10px">' + li(gone) + '</div></details>' : '') + '</div>';
  }
  function bindClean(f) {
    document.querySelectorAll('[data-preset]').forEach((el) => el.addEventListener('click', () => {
      const k = el.dataset.preset;
      if (k === 'custom') f.clean.custom = f.clean.custom || { ...W.clean.PRESETS[f.clean.preset].opts };
      else { f.clean.preset = k; f.clean.custom = null; }
      renderMain();
    }));
    document.querySelectorAll('[data-opt]').forEach((el) => el.addEventListener('change', () => { if (!f.clean.custom) f.clean.custom = { ...W.clean.PRESETS[f.clean.preset].opts }; f.clean.custom[el.dataset.opt] = el.checked; renderMain(); }));
    document.querySelectorAll('input[name=scope]').forEach((el) => el.addEventListener('change', () => { f.clean.scope = el.value; renderMain(); }));
    const btn = $('#doClean');
    if (btn) btn.onclick = async () => {
      btn.disabled = true; btn.textContent = 'Working…';
      const opts = cleanOpts(f);
      const suffix = f.clean.custom ? '_clean' : W.clean.PRESETS[f.clean.preset].suffix;
      const name = baseName(f.name) + suffix + (opts.flatten && opts.flattenVelixoOnly ? 'V' : '') + ext(f.name);
      try {
        const { bytes, log } = await W.clean.cleanWorkbook(f.buffer.slice(0), opts);
        const report = await W.analyze.analyzeWorkbook(bytes.slice().buffer, name, { deep: S.deep });
        f.clean.result = { name, bytes, log, report };
        download(name, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      } catch (err) { console.error(err); f.clean.result = { error: err.message }; }
      renderMain();
    };
    const re = $('#reDl'); if (re) re.onclick = () => download(f.clean.result.name, f.clean.result.bytes, 'application/octet-stream');
    const op = $('#openOut'); if (op) op.onclick = () => {
      const r = f.clean.result;
      const item = { id: ++S.seq, name: r.name, size: r.bytes.length, buffer: r.bytes.slice().buffer, status: 'done', report: r.report, progress: 1, tab: 'summary', clean: { preset: 'share', scope: 'all', custom: null, result: null } };
      S.files.push(item); S.sel = item.id; renderSide(); renderMain(); $('#main').scrollTop = 0;
    };
  }

  /* ------------------------------------------------------------ exports */
  function baseName(nm) { return nm.replace(/\.[^.]+$/, ''); }
  function ext(nm) { return (nm.match(/\.[^.]+$/) || ['.xlsx'])[0]; }
  function protect(v) { if (v == null) return ''; const t = String(v); return t && '=+-@'.includes(t[0]) ? "'" + t : t; }
  function toCsv(rows) {
    if (!rows.length) return '﻿';
    const cols = Object.keys(rows[0]);
    const q = (v) => { const s = protect(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return '﻿' + [cols.map(q).join(','), ...rows.map((r) => cols.map((c) => q(r[c])).join(','))].join('\r\n') + '\r\n';
  }
  function row(section, category, sheet, location, item, severity, calls, cells, via, inside, detail, formula) {
    return { Section: section, Category: category, Sheet: sheet || '', Location: location || '', Item: item || '', Severity: severity || '', Calls: calls ?? '', 'Cells affected': cells ?? '', 'Via name': via || '', 'Inside add-in call': inside || '', Detail: detail || '', Formula: formula || '' };
  }
  function findingsRows(R) {
    const out = [];
    for (const f of R.findings) out.push(row('Summary', f.cat, '', '', f.title, f.sev, '', '', '', '', f.detail, ''));
    for (const f of R.volatile.findings) out.push(row('Volatile functions', f.area, f.sheet, f.cell + (f.note ? ' (' + f.note + ')' : ''), f.fn + (f.arg ? '("' + f.arg + '")' : ''), f.sev, f.calls, f.cells, f.via, f.inside, W.analyze.CATALOGUE[f.fn].note, f.formula));
    const P = R.perf;
    if (P.calcManual) out.push(row('Performance risks', 'Calculation mode', '', '', '', 'Review', '', '', '', '', 'Set to "' + R.workbook.calcMode + '"', ''));
    if (P.fullCalcOnLoad) out.push(row('Performance risks', 'Full calculation on load', '', '', '', 'Review', '', '', '', '', 'Workbook fully recalculates on every open', ''));
    for (const g of (R.volPrec || {}).groups || []) out.push(row('Volatile functions', 'Velixo cell reads a volatile cell', g.sheet, g.cell, g.fns, 'Always', '', g.cells, '', '', 'Volatile source: ' + g.source, g.formula));
    for (const w of P.wholeRefs || []) out.push(row('Performance risks', 'Whole-column / whole-row reference', w.sheet, w.cell, w.refs, 'Review', '', w.cells, '', w.cls === 'addin' ? w.usedIn : '', w.cls === 'addin' ? 'Whole range passed to an add-in function' : w.cls === 'array' ? 'Array-evaluated over the whole column or row (' + w.usedIn + ')' : 'Whole-column reference in ' + (w.usedIn || 'a native formula'), w.formula));
    for (const b of P.bloated || []) out.push(row('Performance risks', 'Used range bloat', b.sheet, '', '', 'Review', '', b.phantom, '', '', 'Used to ' + colL(b.maxCol) + b.maxRow + '; data ends ' + colL(b.lastDataCol) + b.lastDataRow, ''));
    for (const l of P.externalLinks) out.push(row('Performance risks', 'External workbook link', '', '', '', 'Review', '', '', '', '', l.target, ''));
    for (const c of P.cf.sheets) out.push(row('Performance risks', 'Conditional formatting volume', c.sheet, '', '', P.cf.flagged ? 'Review' : '', c.rules, c.biggest, '', '', c.rules + ' rule(s); largest covers ' + c.biggest + ' cell(s) in ' + c.areas + ' fragment(s)', ''));
    for (const s of R.sheets) if (s.stats) for (const [k, v] of Object.entries(s.stats.errors)) out.push(row('Formulas', 'Cached error value', s.name, '', k, '', '', v, '', '', '', ''));
    for (const fn of R.velixo.functions) out.push(row('Velixo', 'Velixo function usage', fn.sheets.join('; '), '', fn.name, '', fn.calls, fn.cells, '', '', '', ''));
    for (const x of (R.snapshot || {}).spillRefs || []) out.push(row('Velixo Tools', 'Snapshot - reads Velixo spill', x.sheet, x.cell, x.targets, 'Review', '', x.cells, '', '', x.where, x.formula));
    for (const L of R.distribution || []) for (const r of L.rows) for (const t of [...r.issues, ...r.notes]) out.push(row('Velixo Tools', 'Distribution list', L.sheet, 'Row ' + r.row, r.fileName, r.issues.includes(t) ? 'Review' : 'Info', '', '', '', '', t, ''));
    for (const g of (R.velixoLoad || {}).unfiltered || []) out.push(row('Velixo', 'GI without filter', g.sheet, g.cell, g.gi, 'Review', '', g.rows, '', '', '', g.formula));
    for (const a of R.autoHide || []) for (const t of a.issues) out.push(row('Velixo', 'Auto-hide range', a.sheet, a.ref, a.kind, 'Review', '', '', '', '', t.text, ''));
    for (const c of R.velixo.connections) out.push(row('Velixo', 'Connection', '', '', c.name, '', '', '', '', '', [c.type, c.uri, c.tenant].filter(Boolean).join(' | '), ''));
    return out;
  }
  function simpleRows() {
    const out = [];
    for (const f of S.files) {
      if (f.status !== 'done') { out.push({ File: f.name, Sheet: '(workbook)', Category: 'Not scanned', Issue: f.report ? f.report.error : 'Not scanned', Severity: '', Count: 0, 'Cells affected': 0 }); continue; }
      const R = f.report; const before = out.length;
      const add = (sheet, cat, issue, sev, count, cells) => out.push({ File: f.name, Sheet: sheet, Category: cat, Issue: protect(issue), Severity: sev || '', Count: count || 0, 'Cells affected': cells || 0 });
      add('(workbook)', 'Velixo', R.velixo.isVelixo ? 'Velixo ' + R.velixo.edition + (R.velixo.addin ? ' add-in ' + R.velixo.addin.version : '') : 'Not a Velixo workbook', 'Info', R.velixo.connections.length, R.velixo.cells);
      const agg = new Map();
      for (const v of R.volatile.findings) { const k = v.sheet + '|' + v.fn; const a = agg.get(k) || { sheet: v.sheet, fn: v.fn, sev: v.sev, c: 0, cells: 0 }; a.c += v.calls; a.cells += v.cells; agg.set(k, a); }
      for (const a of agg.values()) add(a.sheet, 'Volatile function', a.fn, a.sev, a.c, a.cells);
      for (const x of R.findings.filter((x) => x.cat !== 'Volatile')) add('(workbook)', x.cat, x.title, x.sev);
      if (out.length === before + 1 && !R.findings.length) add('(workbook)', 'Clean', 'No issues found', '');
    }
    return out;
  }
  function ticketSummary(f) {
    const R = f.report, vx = R.velixo;
    const L = [];
    L.push('Workbook: ' + f.name + ' (' + kb(R.file.size) + ') (As of ' + new Date().toLocaleDateString() + ')');
    L.push('Excel: ' + R.sheets.length + ' sheets, ' + n(R.sheets.reduce((a, s) => a + (s.stats ? s.stats.formulaCells : 0), 0)) + ' formula cells, ' + R.workbook.calcMode + ' calc mode' + (R.package.hasVba ? ', macros' : ''));
    if (vx.isVelixo) {
      const ver = nxVersion(vx);
      L.push('Velixo: ' + vx.edition + (ver ? ' ' + ver : '') + (Object.keys(vx.erps || {}).length ? ', ERP ' + Object.keys(vx.erps).join(' + ') : '') + ', ' + n(vx.cells) + ' Velixo formula cells');
      if (vx.connections.length) L.push('Connections: ' + vx.connections.map((c) => c.name + (c.uri ? ' (' + c.uri + ')' : '')).join(', '));
      if (vx.lastRefresh && vx.lastRefresh.on) L.push('Last refresh: ' + dt(vx.lastRefresh.on) + (vx.lastRefresh.by ? ' by ' + vx.lastRefresh.by : ''));
    } else L.push('Velixo: not a Velixo workbook');
    L.push('');
    L.push('Results:');
    const tk = { all: ['high', 'medium', 'low'], hm: ['high', 'medium'], h: ['high'] }[S.set.ticket] || ['high', 'medium', 'low'];
    const res = R.findings.filter((x) => tk.includes(x.sev));
    if (!res.length) L.push('No issues found');
    const tag = (sev) => '[' + sev.toUpperCase() + '] ';
    let distDone = false;
    for (const x of res) {
      if (x.sec === 'tl-dist') {
        if (distDone) continue; distDone = true;
        for (const D of R.distribution || []) {
          for (const i of D.issues) L.push(tag(i.sev) + 'Distribution list "' + D.sheet + '": ' + i.text);
          const byText = new Map();
          for (const r of D.rows) for (const t of r.issues) { if (!byText.has(t)) byText.set(t, []); byText.get(t).push(r.row); }
          for (const [t, rows] of byText) L.push(tag('medium') + 'Distribution list "' + D.sheet + '" row' + (rows.length > 1 ? 's ' : ' ') + rows.join(', ') + ': ' + t);
        }
      } else if (x.sec === 'vx-autohide') {
        for (const a of (R.autoHide || []).filter((y) => y.issues.length)) for (const i of a.issues) L.push(tag(x.sev) + 'Auto-hide ' + a.kind.toLowerCase() + ' on "' + a.sheet + '": ' + i.text);
      } else L.push(tag(x.sev) + x.title);
    }
    return L.join('\n');
  }
  // Velixo NX build is only in the file if a VELIXOVERSION() cell exists (its cached result). The webextension version is the store manifest, not NX.
  function nxVersion(vx) {
    const v = (vx.versions || []).filter((x) => x.fn === 'VELIXOVERSION' && x.value && /^\d{4}\.\d+/.test(x.value)).map((x) => String(x.value).replace(/-g[0-9a-f]+$/i, ''));
    if (!v.length) return null;
    return v.sort((a, b) => b.localeCompare(a, undefined, { numeric: true }))[0];
  }
  // Viewer only saves allowlisted extensions; macro/template workbooks are wrapped in a .zip.
  const SAVE_OK = /\.(xlsx|csv|json|txt|md|zip|html|pdf)$/i;
  const dlCap = window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads') : Promise.resolve(null);
  async function download(name, data, type) {
    let bytes = data instanceof Blob ? new Uint8Array(await data.arrayBuffer()) : typeof data === 'string' ? new TextEncoder().encode(data) : data;
    let fname = name, zipped = false;
    if (!SAVE_OK.test(fname)) {
      bytes = await W.zip.writeZip(new Map([[name, bytes]]), [name]);
      fname = name + '.zip'; zipped = true;
    }
    const dl = await dlCap;
    if (!dl) {
      // Not running as a claude.ai artifact (e.g. the page saved as a local .html file): use a normal browser download.
      try { const u = URL.createObjectURL(new Blob([bytes], { type: type || 'application/octet-stream' })); const a = document.createElement('a'); a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); toast('Saved ' + fname); }
      catch { toast('Downloads are not available in this view'); }
      return;
    }
    try {
      await dl.save({ filename: fname, data: new Blob([bytes], { type }) });
      toast(zipped ? 'Saved ' + fname + ' - extract it to get ' + name : 'Saved ' + fname);
    } catch (err) {
      const c = err && err.code;
      if (c === 'declined') toast('Download cancelled');
      else if (c === 'rate_limited') toast('A save prompt is already open - finish it, then try again');
      else if (c === 'too_large') toast(fname + ' is too large to save here');
      else { console.error(err); toast('Could not save ' + fname + (c ? ' (' + c + ')' : '')); }
    }
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); toast('Copied to clipboard'); return; } catch {}
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    toast(ok ? 'Copied to clipboard' : 'Copy was blocked here - try again, or use the CSV/JSON export');
  }
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

  /* ------------------------------------------------------------ boot */
  function boot() {
    const drop = $('#drop'), input = $('#picker');
    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', () => { addFiles([...input.files]); input.value = ''; });
    ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (x) => { x.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (x) => { x.preventDefault(); if (ev === 'drop' || !x.relatedTarget) drop.classList.remove('over'); }));
    document.addEventListener('drop', (x) => { const fl = [...(x.dataTransfer?.files || [])]; if (fl.length) addFiles(fl); });
    $('#files').addEventListener('click', (x) => {
      const rm = x.target.closest('[data-rm]');
      if (rm) { const id = +rm.dataset.rm; S.files = S.files.filter((f) => f.id !== id); if (S.sel === id) S.sel = S.files[0]?.id || null; renderSide(); renderMain(); return; }
      const it = x.target.closest('[data-id]'); if (it) { S.sel = +it.dataset.id; renderSide(); renderMain(); $('#main').scrollTop = 0; }
    });
    loadSet(); applySet();
    applyMode();
    document.querySelectorAll('#view button').forEach((b) => b.addEventListener('click', () => { S.advanced = b.dataset.v === 'advanced'; saveSet(); applyMode(); renderSide(); renderMain(); }));
    $('#gear').addEventListener('click', (x) => { x.stopPropagation(); toggleSettings(); });
    $('#settings').addEventListener('click', (x) => x.stopPropagation());
    document.addEventListener('click', (x) => { if (!$('#settings').hidden && !x.target.closest('#settings') && !x.target.closest('#gear')) toggleSettings(false); });
    $('#sideToggle').addEventListener('click', () => { S.side = !S.side; renderSide(); });
    $('#railAdd').addEventListener('click', () => input.click());
    document.addEventListener('click', (x) => { if (S.menu && !x.target.closest('.menuwrap')) { S.menu = false; renderTop(); } });
    document.addEventListener('click', (x) => { const c = x.target.closest('[data-copy]'); if (c) { x.stopPropagation(); copyText(c.dataset.copy); } });
    renderSide(); renderMain();
  }
  window.WBI.ui = { state: S, addFiles };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
